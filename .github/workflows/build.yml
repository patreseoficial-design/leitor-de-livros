name: Build Android

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      VERSION_CODE: ${{ github.run_number }}

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Compilar versão de teste (APK)
        run: gradle assembleDebug

      - name: Enviar APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      # Versão para a Play Store: só roda se a chave estiver
      # cadastrada nos Secrets do repositório
      - name: Preparar chave de assinatura
        id: chave
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "existe=true" >> "$GITHUB_OUTPUT"
          else
            echo "Chave não cadastrada: pulando a versão da Play Store"
          fi

      # Sempre compila (confere se a versão da loja está ok);
      # só sai assinada quando a chave existe
      - name: Compilar versão da Play Store (AAB)
        env:
          KEYSTORE_FILE: ${{ steps.chave.outputs.existe == 'true' && format('{0}/upload.jks', runner.temp) || '' }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle bundleRelease

      - name: Enviar AAB
        if: steps.chave.outputs.existe == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: app-release-playstore
          path: app/build/outputs/bundle/release/app-release.aab

      - name: Apagar chave
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"
